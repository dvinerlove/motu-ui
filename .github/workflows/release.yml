name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build -c Release

      - name: Publish zip layout (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: dotnet publish -c Release -r win-x86 --self-contained -p:PublishReadyToRun=true -o publish

      - name: Publish portable single-exe (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: dotnet publish -c Release -r win-x86 --self-contained -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish-single
          # no PublishReadyToRun here: R2R+compression single-file crashes at startup (0x8007007E)

      - name: Package (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          # crash-dump/debug infrastructure the app never uses
          Remove-Item publish\createdump.exe, publish\mscordbi.dll, publish\mscordaccore.dll, publish\dbgshim.dll, publish\Microsoft.DiaSymReader.Native.x86.dll, publish\*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path 'publish\*' `
            -DestinationPath "motu-ui-v$v-win-x86.zip" -Force
          Copy-Item publish-single\motu-ui.exe "motu-ui-v$v-win-x86-portable.exe"

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            motu-ui-v*-win-x86.zip
            motu-ui-v*-win-x86-portable.exe
          generate_release_notes: true
