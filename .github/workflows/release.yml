name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build -c Release

      - name: Publish (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: dotnet publish -c Release -r win-x86 --self-contained -p:PublishReadyToRun=true -o publish

      - name: Package (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          Compress-Archive -Path 'publish\*' `
            -DestinationPath "motu-ui-v$v-win-x86.zip" -Force

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: motu-ui-v*-win-x86.zip
          generate_release_notes: true
